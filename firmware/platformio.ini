; Hestia controller firmware
;
;   pio run -e esp32dev               build for the ESP32 (needs include/secrets.h)
;   pio run -e esp32dev -t upload     flash it
;   pio test -e native                run the controller and command tests on this PC
;
; The native tests run the shared spec (../spec/controller_vectors.json and
; ../spec/command_vectors.json) against lib/hestia_core, exactly as the
; gateway's Python tests do: both sides must agree or CI fails.

[platformio]
default_envs = esp32dev

[env]
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.0

[env:esp32dev]
platform = espressif32 @ ^6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    knolleary/PubSubClient @ ^2.8
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; tests run from this folder; the specs live next to it, shared with the gateway
    -DSPEC_DIR=\"../spec\"
