[project]
name = "hestia"
version = "2.0.0"
description = "Hestia: supervision, safety and planning for solar-hydrogen systems in buildings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Iyed Benslimen" }]
# No licence on purpose: source visible for evaluation, all rights reserved.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "paho-mqtt>=2.1",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "tzdata>=2025.2",
]

[project.scripts]
# Admin command line: users, journal verification, model checks.
hestia = "hestia.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit[toml]>=1.8",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hestia"]

# ── Quality gates (run by CI and pre-commit) ─────────────────────────────────
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I imports, B bugbear, UP pyupgrade, S bandit-like
# security rules, SIM simplifications, RUF ruff-specific.
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # typographic characters (°, ₂, —) are intended in messages
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # asserts, test passwords, test randomness
"src/hestia/twin/**" = ["S311"]  # the twin's weather noise is not cryptography

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["hestia"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["paho.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["hestia"]
branch = true

[tool.bandit]
exclude_dirs = ["tests"]
