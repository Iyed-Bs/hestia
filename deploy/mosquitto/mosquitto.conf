# Mosquitto broker for Hestia controllers.
#
# - TLS only (no plain port 1883), TLS 1.2 minimum;
# - every client logs in (no anonymous access), with a password made by
#   deploy/add-mqtt-user.sh;
# - the ACL file gives each controller its own topics and nothing else.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# A controller sends ~1 KB every 2 s; nothing legitimate is larger than this.
message_size_limit 8192
max_inflight_messages 20
max_queued_messages 200

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
