# Every push and pull request: quality, tests and security checks for every
# part of Hestia. Actions are pinned to full commit SHAs (supply-chain safety);
# Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Gateway (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install (exactly as locked)
        run: uv sync --frozen
      - name: Lint and format
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Types (mypy strict)
        run: uv run mypy src
      - name: Security lint (bandit)
        run: uv run bandit -q -r src -c pyproject.toml
      - name: Tests, including the shared controller and command specs
        run: uv run pytest --cov=hestia --cov-report=term-missing:skip-covered
      - name: Known vulnerabilities in dependencies (pip-audit)
        run: |
          # The lock file, exported with hashes: audited exactly as installed.
          uv export --frozen --no-dev --no-emit-project > requirements.txt
          uv run pip-audit --strict --disable-pip -r requirements.txt

  frontend:
    name: Dashboard (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Known vulnerabilities in shipped dependencies
        run: npm audit --omit=dev --audit-level=high

  firmware:
    name: Firmware (ESP32)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.1.19
      - name: Native tests (shared specs, hash vectors, permit lease)
        run: pio test -e native
      - name: ESP32 build
        run: |
          # A throwaway secrets.h: placeholders plus an all-zero test key.
          sed 's/"replace-with-64-hex-characters-generated-as-above"/"'"$(printf '0%.0s' {1..64})"'"/' \
            include/secrets_template.h > include/secrets.h
          pio run -e esp32dev

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container image (build + Trivy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: hestia-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (the image starts and answers its health check)
        run: |
          docker run -d --name hestia --read-only --tmpfs /tmp \
            -e HESTIA_ENV=development -e HESTIA_DATA_DIR=/tmp/hestia hestia-gateway:ci
          for i in $(seq 1 30); do
            if docker exec hestia python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          docker logs hestia; exit 1
      - name: Vulnerability scan (fail on fixable high/critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hestia-gateway:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
